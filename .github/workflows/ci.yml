name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"        # matches containers; kafka-python 2.0.2 breaks on 3.12
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            spark/requirements.txt
            producer/requirements.txt

      - name: Install
        run: |
          pip install -r spark/requirements.txt -r producer/requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check model producer spark tests

      - name: Test (synthetic training + contract + scoring + schema)
        run: pytest -q tests

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    strategy:
      matrix:
        service: [producer, spark]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max